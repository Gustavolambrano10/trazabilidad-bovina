{% extends "hato/base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block contenido %}
<h1>{{ titulo }}</h1>
<div class="tarjeta">
  <form method="post" {% if multipart %}enctype="multipart/form-data"{% endif %}>{% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Guardar</button>
    <a class="btn sec" href="javascript:history.back()">Cancelar</a>
  </form>
</div>
{% endblock %}
