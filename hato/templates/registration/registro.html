{% extends "hato/base.html" %}
{% block titulo %}Crear cuenta{% endblock %}
{% block contenido %}
<div class="centro tarjeta">
  <h1>Crear cuenta</h1>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Crear cuenta</button>
  </form>
  <p>¿Ya tiene cuenta? <a href="{% url 'login' %}">Ingrese aquí</a>.</p>
</div>
{% endblock %}
